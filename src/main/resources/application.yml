spring:
  datasource:
    url: jdbc:mysql://localhost:3306/local-db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: mvp
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
        default_batch_fetch_size: 100

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: debug
    org.springframework.security.oauth2: trace