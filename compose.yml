services:
  mysql:
    image: mysql:8.0
    container_name: mvp-local-db-container
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: local-db
      MYSQL_USER: mvp
      MYSQL_PASSWORD: 1234
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data: